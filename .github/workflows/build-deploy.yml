name: Build and Deploy Unity Game

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ release ]

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ release ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Unity (License & Dependencies)
      uses: game-ci/unity-setup@v2
      with:
        unity-version: "6000.0.48f1"  # Replace with your Unity version
        target-platform: WebGL        # Or Windows, Android, iOS, etc.
      
    - name: Build Unity Project
      uses: game-ci/unity-builder@v2
      with:
        target-platform: WebGL        # Must match setup step
        project-path: "Assets"  # Replace with your Unity project folder
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: unity-build
        path: build/                  # Default output folder for Unity builds
        retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release' && github.event_name == 'push'
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: unity-build
        path: build/
        
    - name: Deploy to production
      run: |
        echo "Deploying Unity game..."
        # Add your deployment commands here (e.g., upload to itch.io, S3, etc.)